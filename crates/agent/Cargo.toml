[package]
autotests = false
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent registry, command building, and fan-out planning for the ADE."

[dependencies]
config = { path = "../config" }

# Signalling a probe's whole process group at the deadline, as `checks` and the
# worktree setup runner already do. Killing only the direct child leaves a
# forked grandchild holding the output pipes open.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
