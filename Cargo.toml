[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/app",
    "crates/computer",
    "crates/config",
    "crates/chat",
    "crates/mcp",
    "crates/provider",
    "crates/schedule",
    "crates/slack",
    "crates/store",
    "crates/voice",
]

# Mirrored from zed's workspace — cargo patches don't propagate through git
# dependencies. See docs/gpui.md.
[patch.crates-io]
# Redirect the crates.io gpui that `guise-ui` requests onto the exact zed git
# rev libsinclair builds, so a single gpui resolves across the tree.
gpui = { git = "https://github.com/zed-industries/zed", rev = "96285fc1" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
# Vendored copy of `block` (transitive, via gpui -> cocoa) with a one-line fix
# for a future-incompatibility lint (uninhabited extern static, #74840).
block = { path = "thirdparty/block" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "signal", "net"] }
uuid = { version = "1", features = ["v4"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "96285fc1" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "96285fc1", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
# Guise on Sinclair's pinned-gpui compat branch (sinclair-v1.9.1), the same rev
# Sinclair vendors. Imported as `guise`.
guise-ui = { git = "https://github.com/wess/guise", rev = "c472878a4b06142fed8ba38b0f6f0db48fb4db2f", features = ["webview"] }
libsinclair = { git = "https://github.com/wess/sinclair", rev = "1ebb683af7aaffc6954b57269688c3270726fd61" }

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"

# ld-27037 (Xcode 27) emits proc-macro dylibs without debug info that dyld
# then rejects ("mis-aligned LINKEDIT string pool"). Keeping limited debug
# info on build-time artifacts avoids it; nothing that ships is affected.
[profile.release.build-override]
debug = "limited"
